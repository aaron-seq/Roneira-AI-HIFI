[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roneira-ml-service"
version = "3.0.0"
description = "ML Service for Roneira AI HIFI Stock Prediction (FastAPI, main:app)"
requires-python = ">=3.11"
# Dependencies are sourced from requirements.txt so there is a single canonical
# dependency list, whether you install with `pip install -r requirements.txt`
# or `pip install .`.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]