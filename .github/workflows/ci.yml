name: CI Pipeline

# Trigger on push to main and pull requests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  # Allow manual workflow dispatch
  workflow_dispatch:

# NOTE ON SCOPE
# This pipeline validates both production surfaces:
#   - `src/`  — the Next.js app that deploys to Vercel (see vercel.json)
#   - `ml/`   — the FastAPI ML service
# That is now the whole repository: the legacy `frontend/`, `backend/`,
# `ml-service/`, `realtime/` and `infrastructure/` trees were deleted, so there
# is no longer a distinction between "canonical" and "reference" paths.
# The jobs below implement the launch verification listed in task.md.

jobs:
  # Next.js application: lint, types, unit tests, production build
  web:
    name: Web CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:web

      - name: Build application
        run: npm run build

  # FastAPI ML service: model and inference tests
  ml:
    name: ML CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

  # Repository-wide vulnerability scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Confirm the files required to deploy the canonical surfaces are present
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [web, ml]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment files
        run: |
          test -f package.json
          test -f vercel.json
          test -f next.config.ts
          test -f ml/requirements.txt
          test -f ml/app/main.py
          test -f README.md

      - name: Validate environment template
        run: test -f .env.example

      - name: Deployment ready notification
        run: |
          echo "Canonical surfaces verified. Ready for deployment to:"
          echo "- Web (src/): Vercel"
          echo "- ML  (ml/):  Railway/Render"

# Environment variables for the entire workflow
env:
  FORCE_COLOR: 1
  CI: true
