name: CI Pipeline

# Trigger on push to main and pull requests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  # Allow manual workflow dispatch
  workflow_dispatch:

# NOTE ON SCOPE
# This pipeline validates both production surfaces:
#   - `src/`  — the Next.js app that deploys to Vercel (see vercel.json)
#   - `ml/`   — the FastAPI ML service
# That is now the whole repository: the legacy `frontend/`, `backend/`,
# `ml-service/`, `realtime/` and `infrastructure/` trees were deleted, so there
# is no longer a distinction between "canonical" and "reference" paths.
# The jobs below implement the launch verification listed in task.md.

jobs:
  # Next.js application: lint, types, unit tests, production build
  web:
    name: Web CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22 LTS: Node 20 reached end-of-life in April 2026, and vitest 5 needs >= 22.12.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:web

      - name: Build application
        run: npm run build

  # FastAPI ML service: model and inference tests
  ml:
    name: ML CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

  # Public metadata and authored fixtures are testable without provider access.
  data:
    name: Data project CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Validate public dataset contracts and evidence
        run: python data/validate.py --metadata-only
      - name: Validate synthetic data
        run: python data/validate.py
      - name: Run offline data tests
        run: python -m unittest discover -s data/tests -v

  # Empty disposable database only; never use hosted credentials here.
  database:
    name: Database CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: roneira_tests
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roneira_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: roneira_tests
      PGPASSWORD: disposable-ci-only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Apply prerequisites and application migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run database regressions
        run: |
          for regression in supabase/tests/*.sql; do
            if [ "$regression" != "supabase/tests/bootstrap.sql" ]; then
              psql -v ON_ERROR_STOP=1 -f "$regression"
            fi
          done

  # Repository-wide vulnerability scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Confirm the files required to deploy the canonical surfaces are present
  deployment-check:
    name: Deployment file checks
    runs-on: ubuntu-latest
    needs: [web, ml, data, database]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment files
        run: |
          test -f package.json
          test -f vercel.json
          test -f next.config.ts
          test -f ml/requirements.txt
          test -f ml/app/main.py
          test -f README.md

      - name: Validate environment template
        run: test -f .env.example

      - name: Deployment file check summary
        run: |
          echo "Required web/ML deployment files are present."
          echo "Hosted runtime, authentication, provider rights and model quality require separate evidence."

# Environment variables for the entire workflow
env:
  FORCE_COLOR: 1
  CI: true
