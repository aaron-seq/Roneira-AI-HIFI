[pytest]
# Put the ml/ package root on sys.path so `from app.models... import ...` in the
# test modules resolves regardless of how pytest is invoked (`pytest` vs
# `python -m pytest`) or which directory it is launched from.
pythonpath = .
testpaths = tests

# Pinned explicitly because pytest-asyncio warns that its default is changing
# in a future release; setting it means the upgrade cannot silently alter how
# async fixtures are scoped.
asyncio_default_fixture_loop_scope = function
